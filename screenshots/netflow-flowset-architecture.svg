<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchNetFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchNetFlow)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Enterprise Flow Telemetry Architecture: Insecure NetFlow vs Zero-Trust IPFIX
  </text>

  <!-- Left: Flawed Deployment -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Legacy NetFlow v5/v9 (Cleartext UDP)
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#030712" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Plaintext UDP 2055 &bull; 32-bit Integer Counters</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">1800s Template Timeout &bull; No Option Template Export</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC TELEMETRY FAILURE MODES:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Eavesdroppers inspect all internal network communication graphs</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; "Template Not Found" drops drop 100% of telemetry after reboots</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 32-bit counters roll over in &lt;35s on 1G and &lt;1s on 100G spine links</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 1:1000 sampling without Option Template underreports volume by 1000x</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CORRUPT METRICS &bull; SILENT LOG LOSS &bull; ZERO SECURITY</text>

  <!-- Right: Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#061614" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: NetFlowIPFIXForge Pro Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#030712" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">RFC 7011 IPFIX over DTLS (Port 4740)</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">64-bit Volume Counters &bull; Epoch Millisecond Timestamps</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b16" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; DTLS in-transit encryption prevents flow snooping and spoofing</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 60s template cadence ensures collectors decode immediately</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 64-bit octet/packet counters prevent integer overflow on 400G</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; RFC 7011 Option Template exports exact sampling rates to SIEM</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 7011 / 7012 &bull; CISCO FNF &bull; JUNIPER JUNOS READY</text>
</svg>
